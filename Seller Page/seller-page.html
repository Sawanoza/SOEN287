<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software License Management</title>
    <link rel="stylesheet" href="seller-page.css" type="text/css">
</head>

<body>
    <div class="bg-container">
        <div class="section-title">
    <h1>Welcome to Software License Management</h1>


    <div class="section-box">
        <h2>Generate Serial Number:</h2>
        <form>
            <label for="renewSerialNumber">Generate Serial Number: </label>
            <p id="SrNumber">No Serial Number Available</p>
            <button type="submit" onclick="generateKey()">Generate Serial Number</button>
        </form>
    </div>


    <!-- License Association Form -->
    <div class="section-box">
    <h2>Associate License</h2>
    <form>
        <label for="serialNumber">Serial Number:</label>
        <input type="text" id="serialNumber" name="serialNumber" required><br>

        <label for="purchaseDate">Purchase Date:</label>
        <input type="date" id="purchaseDate" name="purchaseDate" required><br>

        <label for="expiryDate">Expiry Date:</label>
        <input type="date" id="expiryDate" name="expiryDate" required><br>

        <label for="softwareName">Software Name:</label>
        <input type="text" id="softwareName" name="softwareName" required><br>

        <button type="submit">Associate License</button>
    </form>
</div>

    <div class="section-box">
    <h2>Client's Liscense:</h2>
    <ul>
        <li>Serial Number: XXX-XXXX-XXX</li>
        <li>Software Name: Pycharm</li>
        <li>Purchase Date: 2023-10-25</li>
        <li>Expiry Date: 2024-10-25</li>
    </ul>
</div>

    <div class="section-box">
    <h2>Delete User's account</h2>
    <form>
        <label for="newSerialNumber">Client Username:</label>
        <input type="text" id="newSerialNumber" name="newSerialNumber" required><br>

        <!-- Additional fields for acquiring a new license -->

        <button type="submit">Delete Account</button>
    </form>
</div>

    <!-- Renew Existing License -->
    <div class="section-box">
    <h2>Renew License</h2>
    <form>
        <label for="renewSerialNumber">Client Username to Renew:</label>
        <input type="text" id="renewSerialNumber" name="renewSerialNumber" required><br>

        <button type="submit">Renew License</button>
    </form>

    <script src="script.js"></script>
</div>



 </div>
</body>
</html>
