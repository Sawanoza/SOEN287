<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software License Management</title>
    <link rel="stylesheet" href="client-style.css" type="text/css">
</head>

<body>
    <div class="bg-container">
        <div class="section-title">
    <h1>Welcome to Software License Management</h1>
</div>

    <!-- Registration Form -->
    <div class="section-box">
    <h2>User Registration</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <button type="submit">Register</button>
    </form>
</div>

    <!-- License Association Form -->
    <div class="section-box">
    <h2>Associate License</h2>
    <form>
        <label for="serialNumber">Serial Number:</label>
        <input type="text" id="serialNumber" name="serialNumber" required><br>

        <label for="purchaseDate">Purchase Date:</label>
        <input type="date" id="purchaseDate" name="purchaseDate" required><br>

        <label for="expiryDate">Expiry Date:</label>
        <input type="date" id="expiryDate" name="expiryDate" required><br>

        <label for="softwareName">Software Name:</label>
        <input type="text" id="softwareName" name="softwareName" required><br>

        <button type="submit">Associate License</button>
    </form>
</div>

    <!-- List of Associated Licenses -->
    <div class="section-box">
    <h2>Your Associated Licenses</h2>
    <ul>
        <li>Serial Number: XXX-XXXX-XXX</li>
        <li>Software Name: Example Software</li>
        <li>Purchase Date: 2023-10-25</li>
        <li>Expiry Date: 2024-10-25</li>
    </ul>
</div>

    <!-- Acquire New License -->
    <div class="section-box">
    <h2>Acquire New License</h2>
    <form>
        <label for="newSerialNumber">New Serial Number:</label>
        <input type="text" id="newSerialNumber" name="newSerialNumber" required><br>

        <!-- Additional fields for acquiring a new license -->

        <button type="submit">Acquire License</button>
    </form>
</div>

    <!-- Renew Existing License -->
    <div class="section-box">
    <h2>Renew License</h2>
    <form>
        <label for="renewSerialNumber">Serial Number to Renew:</label>
        <input type="text" id="renewSerialNumber" name="renewSerialNumber" required><br>

        <button type="submit">Renew License</button>
        <button type="submit">Stop Renewing</button>
    </form>
</div>

<script>
    // Function to handle user registration
    const registerUser = async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const response = await fetch('/register', {
            method: 'POST',
            body: JSON.stringify(Object.fromEntries(formData)),
            headers: { 'Content-Type': 'application/json' }
        });
        alert(await response.text());
    };

    // Function to handle license association
    const associateLicense = async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const response = await fetch('/associateLicense', {
            method: 'POST',
            body: JSON.stringify(Object.fromEntries(formData)),
            headers: { 'Content-Type': 'application/json' }
        });
        alert(await response.text());
    };

    // Function to get a list of associated licenses for a user
    const getLicenses = async () => {
        const username = 'your_username'; // replace with the actual username
        const response = await fetch(`/getLicenses/${username}`);
        const licenses = await response.json();
        // Handle the list of licenses (e.g., update the HTML)
    };

    // Function to acquire a new license
    const acquireLicense = async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const response = await fetch('/acquireLicense', {
            method: 'POST',
            body: JSON.stringify(Object.fromEntries(formData)),
            headers: { 'Content-Type': 'application/json' }
        });
        alert(await response.text());
    };

    // Function to renew or stop renewing a license
    const renewOrStopLicense = async (event, action) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const response = await fetch('/renewLicense', {
            method: 'POST',
            body: JSON.stringify(Object.assign(Object.fromEntries(formData), { action })),
            headers: { 'Content-Type': 'application/json' }
        });
        alert(await response.text());
    };
</script>

 </div>
</body>
</html>
